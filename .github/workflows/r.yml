name: R-CMD-check

# R CMD check --as-cran on the platforms CRAN checks, failing on warnings as
# CRAN does. The R 4.1 job checks the minimum in DESCRIPTION, which httr2
# sets.
#
# Runs only when files that go into the package build change, which is
# everything .Rbuildignore doesn't exclude. Keep the list in step with it.

on:
  push:
    branches: ["main"]
    paths: &package-files
      - DESCRIPTION
      - NAMESPACE
      - LICENSE
      - NEWS.md
      - README.md
      - .Rbuildignore
      - R/**
      - man/**
      - inst/**
      - tests/**
      - vignettes/**
      - .github/workflows/r.yml
  pull_request:
    branches: ["main"]
    paths: *package-files
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: "devel", http-user-agent: "release" }
          - { os: ubuntu-latest, r: "release" }
          - { os: ubuntu-latest, r: "oldrel-1" }
          - { os: ubuntu-latest, r: "4.1" }
          - { os: macos-latest, r: "release" }
          - { os: windows-latest, r: "release" }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Runs rcmdcheck with --no-manual --as-cran and fails on warnings.
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
