url: https://transitmatters.github.io/transitmattr

# Styling matches the Labs docs at https://transitmatters.github.io/architecture/
# (TransitMatters Labs brand colors, Roboto, and the flask logo and favicons in
# man/figures/ and pkgdown/favicon/). More rules are in pkgdown/extra.css.
template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#1773ba"
    navbar-bg: "#1773ba"
    link-color-dark: "#6cb4ea"
    link-hover-color: "#f17a21"
    link-hover-color-dark: "#f17a21"
    body-bg-dark: "#1e2129"
    base_font: {google: "Roboto"}
    heading_font: {google: "Roboto"}
    code_font: {google: "Roboto Mono"}

home:
  title: "transitmattr — R Client for the TransitMatters API"

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, lightswitch]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/transitmatters/transitmattr
      aria-label: GitHub

footer:
  structure:
    left: copyright
    right: [github_org, labs]
  components:
    copyright: © TransitMatters
    github_org: <a href="https://github.com/transitmatters" aria-label="TransitMatters on GitHub"><span class="fab fa-github fa-lg"></span></a>
    labs: <a href="https://transitmatters.org/transitmatters-labs" aria-label="TransitMatters Labs"><span class="fas fa-globe fa-lg"></span></a>

articles:
  - title: "Getting started"
    navbar: ~
    contents:
      - getting-started
  - title: "Worked examples"
    navbar: Worked examples
    contents:
      - red-line-analysis
      - bus-headways
  - title: "Reference"
    navbar: Reference guides
    contents:
      - finding-stops

reference:
  - title: "Query Builders — Rapid Transit"
    contents:
      - tm_rt_query
  - title: "Query Builders — Bus"
    contents:
      - tm_bus_query
      - tm_bus_routes
  - title: "Query Builders — Commuter Rail"
    contents:
      - tm_cr_query
      - tm_cr_routes
  - title: "Query Builders — Ferry"
    contents:
      - tm_ferry_query
      - tm_ferry_routes
  - title: "Service & Ridership"
    contents:
      - tm_scheduled_service
      - tm_service_ridership_dashboard
      - tm_reliability
      - tm_bus_speed_leaderboard
  - title: "Alerts"
    contents:
      - tm_alerts
  - title: "Other"
    contents:
      - tm_facilities
      - tm_routes
      - tm_stops
      - tm_time_predictions
      - tm_weather
      - tm_healthcheck
  - title: "Errors"
    contents:
      - transitmattr_errors
